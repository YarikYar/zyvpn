name: Deploy

on:
  push:
    branches: [corevpn-dev]
  workflow_dispatch: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Unit tests
        run: go test -count=1 ./...

      - name: OpenAPI spec drift-check
        working-directory: ${{ github.workspace }}
        run: make swagger-check

  deploy:
    needs: test
    # Self-hosted runner lives on the docker host (192.168.1.223), so it can
    # talk to local services without exposing SSH publicly.
    runs-on: [self-hosted, docker-host]
    steps:
      - name: Sync /opt/compose/zyvpn to deploy branch
        # deploy.sh делает git pull в локальном клоне. Гарантируем что
        # клон сидит на нужной ветке (а не на старом main).
        run: |
          cd /opt/compose/zyvpn
          git fetch origin
          git checkout corevpn-dev
          git reset --hard origin/corevpn-dev
          echo "--- HEAD ---"
          git log --oneline -1
          echo "--- deploy.sh ---"
          cat scripts/deploy.sh

      - name: Run deploy script
        run: bash /opt/compose/zyvpn/scripts/deploy.sh

      - name: Inspect containers post-deploy
        run: |
          docker ps --format '{{.Names}}\t{{.Image}}\t{{.Status}}' | grep -E "zyvpn|corevpn" || true
          echo "--- backend image label ---"
          docker inspect zyvpn-backend --format '{{.Created}} {{.Image}}' 2>/dev/null || true

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://api.zaruchevskiy.ru/health || true)
            if [ "$code" = "200" ]; then
              echo "API healthy"
              exit 0
            fi
            echo "attempt $i: HTTP=$code, retrying..."
            sleep 5
          done
          echo "API smoke test failed" >&2
          exit 1
