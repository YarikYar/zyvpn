name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum

      - name: Unit tests
        run: go test -count=1 ./...

  deploy:
    needs: test
    # Self-hosted runner lives on the docker host (192.168.1.223), so it can
    # talk to local services without exposing SSH publicly.
    runs-on: [self-hosted, docker-host]
    steps:
      - name: Run deploy script
        run: bash /opt/compose/zyvpn/scripts/deploy.sh

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://api.zaruchevskiy.ru/health || true)
            if [ "$code" = "200" ]; then
              echo "API healthy"
              exit 0
            fi
            echo "attempt $i: HTTP=$code, retrying..."
            sleep 5
          done
          echo "API smoke test failed" >&2
          exit 1
