basePath: /
definitions:
  handler.AddBalanceRequest:
    properties:
      amount:
        type: number
    type: object
  handler.AdminServersResponse:
    properties:
      servers:
        items:
          $ref: '#/definitions/model.ServerAdmin'
        type: array
    type: object
  handler.ApplyPromoCodeRequest:
    properties:
      code:
        type: string
    type: object
  handler.ApplyReferralRequest:
    properties:
      code:
        type: string
    type: object
  handler.BanIPRequest:
    properties:
      expires_at:
        type: string
      ip:
        type: string
      reason:
        type: string
    type: object
  handler.BanUserRequest:
    properties:
      expires_at:
        type: string
      reason:
        type: string
    type: object
  handler.BulkPromoCodeRequest:
    properties:
      cash_amount_rub:
        type: number
      count:
        type: integer
      expires_at:
        type: string
      max_uses:
        type: integer
      plan_id:
        type: string
      prefix:
        type: string
      type:
        $ref: '#/definitions/model.PromoCodeType'
      value:
        type: number
    type: object
  handler.BuySubscriptionRequest:
    properties:
      plan_id:
        example: a3b1f8a2-...
        type: string
      provider:
        enum:
        - ton
        - stars
        - cash
        type: string
    type: object
  handler.CreateCashPaymentRequest:
    properties:
      amount_rub:
        type: number
      plan_id:
        type: string
      server_id:
        type: string
    type: object
  handler.CreatePlanRequest:
    properties:
      description:
        type: string
      duration_days:
        type: integer
      max_devices:
        type: integer
      name:
        type: string
      price_stars:
        type: integer
      price_ton:
        type: number
      price_usd:
        type: number
      server_ids:
        items:
          type: string
        type: array
      sort_order:
        type: integer
      traffic_gb:
        type: integer
      visible_to_referrer_id:
        type: integer
    type: object
  handler.CreatePromoCodeRequest:
    properties:
      cash_amount_rub:
        type: number
      description:
        type: string
      expires_at:
        type: string
      max_uses:
        type: integer
      plan_id:
        type: string
      type:
        $ref: '#/definitions/model.PromoCodeType'
      value:
        type: number
    type: object
  handler.CreateServerRequest:
    properties:
      capacity:
        type: integer
      city:
        type: string
      country:
        type: string
      flag_emoji:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      public_key:
        type: string
      server_address:
        type: string
      server_name:
        type: string
      server_port:
        type: integer
      short_id:
        type: string
      sort_order:
        type: integer
      xui_base_url:
        type: string
      xui_inbound_id:
        type: integer
      xui_password:
        type: string
      xui_username:
        type: string
    type: object
  handler.DailyUptimeResponse:
    properties:
      days:
        items:
          $ref: '#/definitions/model.DailyUptime'
        type: array
      server_id:
        type: string
    type: object
  handler.ExtendSubscriptionRequest:
    properties:
      days:
        type: integer
    type: object
  handler.IncidentsResponse:
    properties:
      incidents:
        items:
          $ref: '#/definitions/model.Incident'
        type: array
    type: object
  handler.ListUsersResponse:
    properties:
      total:
        type: integer
      users:
        items:
          $ref: '#/definitions/model.User'
        type: array
    type: object
  handler.PayFromBalanceRequest:
    properties:
      plan_id:
        type: string
    type: object
  handler.RejectCashPaymentRequest:
    properties:
      reason:
        type: string
    type: object
  handler.ServersResponse:
    properties:
      servers:
        items:
          $ref: '#/definitions/model.ServerPublic'
        type: array
    type: object
  handler.SetBalanceRequest:
    properties:
      balance:
        type: number
    type: object
  handler.TopUpRequest:
    properties:
      amount:
        description: Amount in TON
        type: number
      provider:
        allOf:
        - $ref: '#/definitions/model.PaymentProvider'
        description: ton or stars
    type: object
  handler.UpdatePlanRequest:
    properties:
      clear_visibility:
        description: |-
          ClearVisibility=true forces plan back to public regardless of
          VisibleToReferrerID (which would otherwise mean "leave as-is").
        type: boolean
      description:
        type: string
      duration_days:
        type: integer
      is_active:
        type: boolean
      max_devices:
        type: integer
      name:
        type: string
      price_stars:
        type: integer
      price_ton:
        type: number
      price_usd:
        type: number
      server_ids:
        description: |-
          ServerIDs — UUID серверов, входящих в тариф. nil = не трогаем,
          [] = очистить (тариф станет неактивируемым).
        items:
          type: string
        type: array
      sort_order:
        type: integer
      traffic_gb:
        type: integer
      visible_to_referrer_id:
        type: integer
    type: object
  handler.UpdateServerRequest:
    properties:
      capacity:
        type: integer
      city:
        type: string
      country:
        type: string
      flag_emoji:
        type: string
      is_active:
        type: boolean
      name:
        type: string
      public_key:
        type: string
      server_address:
        type: string
      server_name:
        type: string
      server_port:
        type: integer
      short_id:
        type: string
      sort_order:
        type: integer
      xui_base_url:
        type: string
      xui_inbound_id:
        type: integer
      xui_password:
        type: string
      xui_username:
        type: string
    type: object
  handler.VerifyTONPaymentRequest:
    properties:
      payment_id:
        type: string
      tx_hash:
        type: string
    type: object
  handler.VerifyTopUpRequest:
    properties:
      payment_id:
        type: string
      tx_hash:
        type: string
    type: object
  model.DailyUptime:
    properties:
      date:
        type: string
      uptime:
        type: number
    type: object
  model.Incident:
    properties:
      country:
        type: string
      duration_seconds:
        type: integer
      ended_at:
        type: string
      flag_emoji:
        type: string
      server_id:
        type: string
      server_name:
        type: string
      started_at:
        type: string
    type: object
  model.PaymentProvider:
    enum:
    - ton
    - stars
    - balance
    - cash
    type: string
    x-enum-varnames:
    - PaymentProviderTON
    - PaymentProviderStars
    - PaymentProviderBalance
    - PaymentProviderCash
  model.Plan:
    properties:
      created_at:
        type: string
      description:
        type: string
      duration_days:
        type: integer
      id:
        type: string
      is_active:
        type: boolean
      max_devices:
        type: integer
      name:
        type: string
      price_stars:
        type: integer
      price_ton:
        type: number
      price_usd:
        type: number
      servers:
        description: |-
          Servers — список серверов, на которые провижинится клиент при активации.
          Подтягивается через JOIN с plan_servers, в plans не хранится.
        items:
          $ref: '#/definitions/model.Server'
        type: array
      sort_order:
        type: integer
      traffic_gb:
        type: integer
      visible_to_referrer_id:
        description: |-
          VisibleToReferrerID restricts plan visibility to users referred by
          this user. NULL means public to everyone.
        type: integer
    type: object
  model.PromoCode:
    properties:
      cash_amount_rub:
        type: number
      code:
        type: string
      created_at:
        type: string
      description:
        type: string
      expires_at:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      max_uses:
        type: integer
      plan_id:
        description: CashPlan-specific fields. Both NULL for non-cash_plan promos.
        type: string
      type:
        $ref: '#/definitions/model.PromoCodeType'
      used_count:
        type: integer
      value:
        description: TON amount or days count
        type: number
    type: object
  model.PromoCodeType:
    enum:
    - balance
    - days
    - cash_plan
    type: string
    x-enum-comments:
      PromoCodeTypeBalance: Credits TON to balance
      PromoCodeTypeDays: Adds days to subscription
    x-enum-descriptions:
    - Credits TON to balance
    - Adds days to subscription
    - ""
    x-enum-varnames:
    - PromoCodeTypeBalance
    - PromoCodeTypeDays
    - PromoCodeTypeCashPlan
  model.Server:
    properties:
      capacity:
        description: Capacity and health
        type: integer
      city:
        type: string
      country:
        type: string
      created_at:
        type: string
      current_load:
        type: integer
      flag_emoji:
        type: string
      id:
        type: string
      is_active:
        description: Status
        type: boolean
      last_check_at:
        type: string
      name:
        type: string
      ping_ms:
        type: integer
      server_address:
        description: Server connection details
        type: string
      server_port:
        type: integer
      sort_order:
        type: integer
      status:
        description: online, offline, unknown
        type: string
      updated_at:
        type: string
    type: object
  model.ServerAdmin:
    properties:
      capacity:
        type: integer
      city:
        type: string
      country:
        type: string
      created_at:
        type: string
      current_load:
        type: integer
      flag_emoji:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_check_at:
        type: string
      name:
        type: string
      ping_ms:
        type: integer
      public_key:
        type: string
      server_address:
        type: string
      server_name:
        type: string
      server_port:
        type: integer
      short_id:
        type: string
      sort_order:
        type: integer
      status:
        type: string
      updated_at:
        type: string
      xui_base_url:
        type: string
      xui_inbound_id:
        type: integer
      xui_password:
        type: string
      xui_username:
        type: string
    type: object
  model.ServerPublic:
    properties:
      city:
        type: string
      country:
        type: string
      flag_emoji:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      load_percent:
        type: number
      name:
        type: string
      ping_ms:
        type: integer
      status:
        type: string
      status_since:
        type: string
      traffic_24h_down:
        type: integer
      traffic_24h_up:
        description: Traffic since N hours ago; nil if not enough snapshots in window.
        type: integer
      traffic_all_time:
        type: integer
      uptime_7d:
        type: number
      uptime_24h:
        description: |-
          Monitoring fields populated by ServerService.
          Uptime ratios are 0.0–1.0; nil = no data yet.
        type: number
    type: object
  model.Subscription:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      max_devices:
        type: integer
      plan_id:
        type: string
      servers:
        description: Clients — per-server xui-клиенты этой подписки. JOIN c subscription_clients.
        items:
          $ref: '#/definitions/model.SubscriptionClient'
        type: array
      started_at:
        type: string
      status:
        $ref: '#/definitions/model.SubscriptionStatus'
      sub_token:
        type: string
      traffic_limit:
        type: integer
      traffic_used:
        type: integer
      user_id:
        type: integer
    type: object
  model.SubscriptionClient:
    properties:
      connection_key:
        type: string
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: string
      server:
        allOf:
        - $ref: '#/definitions/model.Server'
        description: |-
          Server — JOIN'нутая инфа о сервере (имя/город/флаг/пинг/статус).
          Заполняется только в read-методах, иначе nil.
      server_id:
        type: string
      subscription_id:
        type: string
      traffic_used:
        type: integer
      xui_client_id:
        type: string
      xui_email:
        type: string
    type: object
  model.SubscriptionStatus:
    enum:
    - active
    - expired
    - cancelled
    type: string
    x-enum-varnames:
    - SubscriptionStatusActive
    - SubscriptionStatusExpired
    - SubscriptionStatusCancelled
  model.TONPaymentInfo:
    properties:
      amount:
        type: string
      comment:
        type: string
      deep_link:
        type: string
      payment_id:
        type: string
      wallet_address:
        type: string
    type: object
  model.User:
    properties:
      balance:
        description: Balance in TON
        type: number
      created_at:
        type: string
      first_name:
        type: string
      id:
        type: integer
      language_code:
        type: string
      last_name:
        type: string
      referral_code:
        type: string
      referred_by:
        type: integer
      updated_at:
        type: string
      username:
        type: string
    type: object
  model.UserWithSubscription:
    properties:
      balance:
        description: Balance in TON
        type: number
      created_at:
        type: string
      first_name:
        type: string
      id:
        type: integer
      is_admin:
        type: boolean
      language_code:
        type: string
      last_name:
        type: string
      referral_code:
        type: string
      referred_by:
        type: integer
      subscription:
        $ref: '#/definitions/model.Subscription'
      updated_at:
        type: string
      username:
        type: string
    type: object
  service.ExchangeRates:
    properties:
      ton_rub:
        type: number
      ton_usd:
        type: number
      usd_rub:
        type: number
    type: object
host: api.zaruchevskiy.ru
info:
  contact: {}
  description: |-
    REST API of the ZyVPN Telegram Mini App backend. All
    /api/* routes require X-Telegram-Init-Data; /api/admin/*
    additionally requires admin role in the database.
  title: ZyVPN API
  version: "1.0"
paths:
  /api/admin/bans:
    get:
      parameters:
      - default: 50
        description: page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: List bans
      tags:
      - admin
  /api/admin/bans/ip:
    post:
      consumes:
      - application/json
      parameters:
      - description: ip + reason
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.BanIPRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Ban IP
      tags:
      - admin
  /api/admin/bans/ip/unban:
    post:
      consumes:
      - application/json
      parameters:
      - description: '{ip}'
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Unban IP
      tags:
      - admin
  /api/admin/logs:
    get:
      parameters:
      - default: 50
        description: page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Admin audit log
      tags:
      - admin
  /api/admin/payments/cash/{payment_id}/approve:
    post:
      parameters:
      - description: payment uuid
        in: path
        name: payment_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Approve cash payment
      tags:
      - admin
  /api/admin/payments/cash/{payment_id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: payment uuid
        in: path
        name: payment_id
        required: true
        type: string
      - description: reason
        in: body
        name: body
        schema:
          $ref: '#/definitions/handler.RejectCashPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Reject cash payment
      tags:
      - admin
  /api/admin/payments/cash/pending:
    get:
      parameters:
      - default: 50
        description: page size
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Pending cash payments
      tags:
      - admin
  /api/admin/plans:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Plan'
            type: array
      security:
      - TelegramInitData: []
      summary: List all plans
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: new plan
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Plan'
      security:
      - TelegramInitData: []
      summary: Create plan
      tags:
      - admin
  /api/admin/plans/{plan_id}:
    delete:
      parameters:
      - description: plan uuid
        in: path
        name: plan_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Delete plan
      tags:
      - admin
    put:
      consumes:
      - application/json
      parameters:
      - description: plan uuid
        in: path
        name: plan_id
        required: true
        type: string
      - description: updates
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.UpdatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Plan'
      security:
      - TelegramInitData: []
      summary: Update plan
      tags:
      - admin
  /api/admin/promo:
    get:
      parameters:
      - default: 50
        description: page size
        in: query
        name: limit
        type: integer
      - default: 0
        description: offset
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: List promo codes
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: promo params
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreatePromoCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PromoCode'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TelegramInitData: []
      summary: Create promo code
      tags:
      - admin
  /api/admin/promo/bulk:
    post:
      consumes:
      - application/json
      parameters:
      - description: params + count
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.BulkPromoCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Bulk-create promo codes
      tags:
      - admin
  /api/admin/promo/deactivate:
    post:
      consumes:
      - application/json
      parameters:
      - description: '{code}'
        in: body
        name: body
        required: true
        schema:
          additionalProperties:
            type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Deactivate promo code
      tags:
      - admin
  /api/admin/servers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.AdminServersResponse'
      security:
      - TelegramInitData: []
      summary: List all servers (admin)
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: server config
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateServerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Server'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TelegramInitData: []
      summary: Create server
      tags:
      - admin
  /api/admin/servers/{server_id}:
    delete:
      parameters:
      - description: server uuid
        in: path
        name: server_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - TelegramInitData: []
      summary: Delete server
      tags:
      - admin
    get:
      parameters:
      - description: server uuid
        in: path
        name: server_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Server'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - TelegramInitData: []
      summary: Get server (admin)
      tags:
      - admin
    put:
      consumes:
      - application/json
      parameters:
      - description: server uuid
        in: path
        name: server_id
