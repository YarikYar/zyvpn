      summary: Create a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                duration_days: { type: integer }
                traffic_gb: { type: integer }
                max_devices: { type: integer }
                price_ton: { type: number }
                price_stars: { type: integer }
                price_usd: { type: number }
                sort_order: { type: integer }
                visible_to_referrer_id: { type: integer, format: int64 }
      responses: { '200': { description: ok } }

  /api/admin/plans/{plan_id}:
    put:
      tags: [admin]
      parameters:
        - { in: path, name: plan_id, required: true, schema: { type: string, format: uuid } }
