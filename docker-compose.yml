services:
  postgres:
    image: postgres:16-alpine
    container_name: zyvpn-postgres
    environment:
      POSTGRES_USER: zyvpn
      POSTGRES_PASSWORD: ${DB_PASSWORD:-zyvpn}
      POSTGRES_DB: zyvpn
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyvpn"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: zyvpn-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zyvpn-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=zyvpn
      - DB_PASSWORD=${DB_PASSWORD:-zyvpn}
      - DB_NAME=zyvpn
      - DB_SSLMODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVER_PORT=8080
      - ENVIRONMENT=production
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_WEBAPP_URL=${TELEGRAM_WEBAPP_URL:-https://vpn.zaruchevskiy.ru}
      - TON_TESTNET=${TON_TESTNET:-false}
      - TON_WALLET_ADDRESS=${TON_WALLET_ADDRESS}
      - ALLOW_ORIGINS=${ALLOW_ORIGINS:-https://vpn.zaruchevskiy.ru,https://api.zaruchevskiy.ru}
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - INSECURE_TG_AUTH_BYPASS=${INSECURE_TG_AUTH_BYPASS:-}
      - PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL:-}
    ports:
      # Exposed for the file-routing Traefik on 192.168.1.150.
      - "${BACKEND_PORT:-8094}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  miniapp:
    build:
      context: ./miniapp
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.zaruchevskiy.ru}
    container_name: zyvpn-miniapp
    ports:
      - "${MINIAPP_PORT:-8095}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
